{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block title %}MHHGA{% endblock %}</title>
    <meta name="description"
          content="{% block description %}Make Headhunting Great Again{% endblock %}">

    {% block styles %}{% endblock %}
</head>
<body>
    <header>
        {% block header %}
            <a href="/">MHHGA</a>
        {% endblock %}
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        {% block footer %}{% endblock %}
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
