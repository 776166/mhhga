
{% extends "base.html" %}

{% block content %}
<div class="container py-4">
    <h1 class="mb-4">
        {% if resume %}Редактирование резюме{% else %}Создание резюме{% endif %}
    </h1>

    <form method="post">
        {% csrf_token %}

        {{ form.non_field_errors }}

        {% for field in form %}
            <div class="mb-3">
                <label for="{{ field.id_for_label }}" class="form-label">
                    {{ field.label }}
                </label>

                {{ field }}

                {% for error in field.errors %}
                    <div class="text-danger small">{{ error }}</div>
                {% endfor %}
            </div>
        {% endfor %}

            <button type="submit" class="btn btn-primary">
                {% if resume %}Сохранить изменения{% else %}Создать{% endif %}
            </button>

        <a href="{% url 'resumes:list' %}" class="btn btn-outline-secondary">
            Отмена
        </a>
    </form>
</div>
{% endblock %}
